name: Build Android APK

on:
  push:
    branches: [ main, codex/glass-ux-refinement ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
          channel: 'stable'
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Clone llama.cpp for native LLM support
        run: |
          git clone --depth 1 https://github.com/ggml-org/llama.cpp.git \
            android/app/src/main/cpp/llama.cpp

      - name: Get dependencies
        run: flutter pub get

      - name: Generate CiteCoach launcher icons
        run: |
          python3 -m pip install --user Pillow
          python3 scripts/generate_launcher_icons.py
          dart run flutter_launcher_icons

      - name: Test native text streaming
        run: |
          g++ -std=c++17 -Wall -Wextra -fsanitize=address,undefined test/native/utf8_stream_test.cpp -o /tmp/citecoach-utf8-test
          /tmp/citecoach-utf8-test

      - name: Analyze glass UX changes
        run: >-
          flutter analyze --no-fatal-infos
          lib/core/theme/app_theme_data.dart lib/core/constants/app_colors.dart
          lib/features/home/presentation/home_screen.dart
          lib/features/verify/presentation/verify_screen.dart
          lib/features/compare/presentation/compare_screen.dart
          lib/features/learn/presentation/learn_screen.dart
          lib/features/learn/providers/learn_provider.dart
          lib/features/learn/domain/study_card.dart
          lib/features/chat/data/llm_service.dart
          lib/features/chat/presentation/chat_screen.dart
          lib/features/chat/presentation/widgets/living_chat_input.dart
          lib/routing/app_router.dart lib/features/library/providers/library_provider.dart
          test/features/home/glass_tools_test.dart
          test/core/theme/glass_contrast_test.dart
          lib/features/setup/data/model_downloader.dart
          lib/features/setup/data/resumable_download.dart
          test/features/setup/resumable_download_test.dart

      - name: Run tests
        timeout-minutes: 5
        run: flutter test --no-pub

      - name: Upload glass UI previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: citecoach-glass-ui-previews
          path: build/ui-previews/*.png
          if-no-files-found: ignore
          retention-days: 14

      - name: Build APK
        run: flutter build apk --release --verbose

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: citecoach-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
