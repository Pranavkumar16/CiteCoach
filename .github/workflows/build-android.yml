name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
          channel: 'stable'
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Clone llama.cpp for native LLM support
        run: |
          git clone --depth 1 https://github.com/ggml-org/llama.cpp.git \
            android/app/src/main/cpp/llama.cpp

      - name: Get dependencies
        run: flutter pub get

      - name: Generate CiteCoach launcher icons
        run: |
          python3 -m pip install --user Pillow
          python3 scripts/generate_launcher_icons.py
          dart run flutter_launcher_icons

      - name: Run tests
        timeout-minutes: 5
        run: flutter test --no-pub

      - name: Upload glass UI previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: citecoach-glass-ui-previews
          path: build/ui-previews/*.png
          if-no-files-found: ignore
          retention-days: 14

      - name: Build APK
        run: flutter build apk --release --verbose

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: citecoach-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
