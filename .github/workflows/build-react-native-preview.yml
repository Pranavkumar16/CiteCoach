name: Build CiteCoach Android

on:
  push:
    branches: [ prototype/react-native-ui ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: prototypes/react-native
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android app dependencies
        run: npm install
      - name: Generate citation-mark app icon
        run: npm run generate:icon
      - name: Type check
        run: npm run typecheck
      - name: Verify retrieval and generated content validation
        run: npm run test:core
      - name: Export browser validation build
        run: npm run export
      - name: Install test browser
        run: npx playwright install --with-deps chromium
      - name: Validate flows and capture mobile layouts
        run: npm run test:ui
      - name: Upload UI previews
        uses: actions/upload-artifact@v4
        with:
          name: citecoach-react-native-screens
          path: prototypes/react-native/screenshots
          retention-days: 14
      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install
      - name: Build standalone Android APK
        working-directory: prototypes/react-native/android
        run: ./gradlew :app:assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a
      - name: Upload CiteCoach APK
        uses: actions/upload-artifact@v4
        with:
          name: citecoach-react-native-apk
          path: prototypes/react-native/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
